[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blindlog"
version = "1.2.2"
description = "Deterministic privacy-preserving logger for Python."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "A. P. Shukla"}
]
keywords = ["logging", "pii", "privacy", "gdpr", "pseudonymization", "observability"]
dependencies = [
    "build>=1.4.4",
    "twine>=6.2.0",
]

[project.urls]
Homepage = "https://github.com/A-P-Shukla/Blind-Log"
Repository = "https://github.com/A-P-Shukla/Blind-Log"
"Bug Tracker" = "https://github.com/A-P-Shukla/Blind-Log/issues"
"Security" = "https://github.com/A-P-Shukla/Blind-Log/security/advisories"

[project.optional-dependencies]
fastapi = ["fastapi", "starlette"]
structlog = ["structlog"]
dev = ["build>=1.4.4", "twine>=6.2.0", "pytest"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["blindlog", "blindlog.integrations"]

[tool.pytest.ini_options]
pythonpath = ["src"]
